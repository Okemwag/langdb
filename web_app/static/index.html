<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangDB Web Interface</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            /* Blue 500 */
            --bg-color: #0f172a;
            /* Slate 900 */
            --card-bg: #1e293b;
            /* Slate 800 */
            --text-color: #f8fafc;
            /* Slate 50 */
            --border-color: #334155;
            /* Slate 700 */
            --code-font: 'Fira Code', 'Roboto Mono', monospace;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            background-color: #020617;
            /* Darker slate */
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-family: var(--code-font);
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 150px;
            align-self: flex-end;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2563eb;
            /* Blue 600 */
        }

        button:active {
            transform: translateY(1px);
        }

        #result-area {
            white-space: pre;
            font-family: var(--code-font);
            overflow-x: auto;
            color: #94a3b8;
            /* Slate 400 */
        }

        .success {
            color: #4ade80;
            /* Green 400 */
        }

        .error {
            color: #f87171;
            /* Red 400 */
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .examples {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .chip {
            background-color: var(--border-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chip:hover {
            background-color: #475569;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>LangDB</h1>
            <p>A Simple Relational Database Engine</p>
        </header>

        <div class="card">
            <div class="input-group">
                <textarea id="sqlInput" placeholder="Enter SQL query here... (e.g., SELECT * FROM users)"></textarea>
                <div class="examples">
                    <span class="chip" onclick="setInput('SELECT * FROM users')">SELECT * FROM users</span>
                    <span class="chip" onclick="setInput('INSERT INTO users VALUES (1, \'Demo\')')">INSERT data</span>
                    <span class="chip"
                        onclick="setInput('SELECT users.name, orders.amount FROM users JOIN orders ON users.id = orders.user_id')">JOIN
                        example</span>
                </div>
                <button id="runBtn" onclick="runQuery()">Run Query</button>
            </div>
        </div>

        <div class="card">
            <h3>Result</h3>
            <div id="result-area">Query results will appear here...</div>
        </div>
    </div>

    <script>
        const sqlInput = document.getElementById('sqlInput');
        const resultArea = document.getElementById('result-area');
        const runBtn = document.getElementById('runBtn');

        function setInput(sql) {
            sqlInput.value = sql;
        }

        async function runQuery() {
            const sql = sqlInput.value.trim();
            if (!sql) return;

            runBtn.classList.add('loading');
            runBtn.innerText = 'Running...';
            resultArea.innerText = '';
            resultArea.className = '';

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sql })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    resultArea.innerText = data.result || 'Success (No output)';
                    resultArea.classList.add('success');
                } else {
                    resultArea.innerText = data.error || 'Unknown error';
                    resultArea.classList.add('error');
                }
            } catch (err) {
                resultArea.innerText = 'Network Error: ' + err.message;
                resultArea.classList.add('error');
            } finally {
                runBtn.classList.remove('loading');
                runBtn.innerText = 'Run Query';
            }
        }
    </script>

</body>

</html>
